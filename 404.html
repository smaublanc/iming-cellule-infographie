<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page introuvable — Groupe IMING</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="maquette/assets/img/mark-iming.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-bg: #ffffff;
      --color-text: #1a1a1a;
      --color-navy: #0b2a4a;
      --color-navy-dark: #071c31;
      --color-red: #a81c2d;
      --font-display: "Plus Jakarta Sans", ui-sans-serif, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: linear-gradient(155deg, var(--color-navy) 0%, var(--color-navy-dark) 75%);
      color: #fff;
      font-family: var(--font-mono);
      text-align: center;
      padding: 24px;
    }
    img { height: 28px; width: auto; opacity: 0.9; }
    .code {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--color-red);
      text-transform: uppercase;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(24px, 5vw, 36px);
      margin: 0;
      letter-spacing: -0.01em;
    }
    p { margin: 0; color: rgba(255,255,255,0.7); font-size: 14.5px; max-width: 420px; line-height: 1.6; }
    a.back {
      margin-top: 8px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
      color: #fff;
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.4);
      padding-bottom: 2px;
      transition: border-color 200ms ease;
    }
    a.back:hover { border-color: var(--color-red); color: var(--color-red); }
  </style>
</head>
<body>
  <img src="maquette/assets/img/mark-iming.png" alt="" />
  <span class="code">404</span>
  <h1>Cette page n'existe pas (ou plus)</h1>
  <p>Le projet ou la page que vous cherchez a peut-être changé d'adresse.</p>
  <a class="back" href="/iming-cellule-infographie/">&larr; Retour à l'accueil</a>
</body>
</html>
